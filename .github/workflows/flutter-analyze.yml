name: Flutter Analyze

# All verification for this repo runs here, on the runner, never
# locally. See the ALL WORK VIA GITHUB ACTIONS order.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build user release APK
        run: flutter build apk --release
      - name: Move user APK aside
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-user.apk
      - name: Build admin release APK
        run: flutter build apk --release -t lib/main_admin.dart
      - name: Move admin APK aside
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-admin.apk
      - name: Upload user APK
        uses: actions/upload-artifact@v4
        with:
          name: dharm-guru-release-apk
          path: build/app/outputs/flutter-apk/app-release-user.apk
      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: dharm-guru-admin-release-apk
          path: build/app/outputs/flutter-apk/app-release-admin.apk
