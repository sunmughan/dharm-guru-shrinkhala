name: Flutter Analyze

# All verification for this repo runs here, on the runner, never
# locally. See the ALL WORK VIA GITHUB ACTIONS order.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Restore Firebase Android config
        # google-services.json is gitignored and never committed.
        # It comes from the GOOGLE_SERVICES_JSON_BASE64 repo secret.
        # The file alone does nothing without the google-services
        # Gradle plugin, so the same values are also written as
        # string resources: FirebaseInitProvider reads them and the
        # native default app exists before Flutter starts. The
        # plugin itself is not applied: it would fail the admin
        # flavor build because the admin package has no matching
        # client in the file yet (console step, still owed).
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 secret is not set in this repo."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          python3 - <<'PYEOF'
          import json
          from xml.sax.saxutils import escape
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          info = data['project_info']
          client = data['client'][0]
          values = {
              'google_app_id': client['client_info']['mobilesdk_app_id'],
              'gcm_defaultSenderId': info['project_number'],
              'google_api_key': client['api_key'][0]['current_key'],
              'google_storage_bucket': info['storage_bucket'],
              'project_id': info['project_id'],
          }
          lines = ['<?xml version="1.0" encoding="utf-8"?>', '<resources>']
          for name in sorted(values):
              lines.append('    <string name="' + name + '" translatable="false">' + escape(values[name]) + '</string>')
          lines.append('</resources>')
          with open('android/app/src/main/res/values/firebase_values.xml', 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print('firebase_values.xml written with: ' + ', '.join(sorted(values)))
          PYEOF
      - name: Restore release keystore
        # Permanent release signing key, so the SHA-1 fingerprint
        # registered in the Firebase console stays valid for
        # every build. The keystore is a PKCS12 file, never
        # committed. Without this step the build falls back to
        # the debug key, whose fingerprint changes every run.
        env:
          DHARM_GURU_KEYSTORE_BASE64: ${{ secrets.DHARM_GURU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DHARM_GURU_KEYSTORE_BASE64" ]; then
            echo "DHARM_GURU_KEYSTORE_BASE64 secret is not set; release builds will sign with the debug key."
            exit 0
          fi
          printf '%s' "$DHARM_GURU_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "Release keystore restored."
      - name: Set build stamp
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "BUILD_STAMP=$(git rev-parse --short HEAD) • $VERSION" >> "$GITHUB_ENV"
      - name: Build user release APK
        env:
          DHARM_GURU_KEYSTORE_PASSWORD: ${{ secrets.DHARM_GURU_KEYSTORE_PASSWORD }}
          DHARM_GURU_KEY_PASSWORD: ${{ secrets.DHARM_GURU_KEY_PASSWORD }}
          DHARM_GURU_KEY_ALIAS: ${{ secrets.DHARM_GURU_KEY_ALIAS }}
        run: flutter build apk --release --flavor user --dart-define="BUILD_STAMP=$BUILD_STAMP"
      - name: Build admin release APK
        env:
          DHARM_GURU_KEYSTORE_PASSWORD: ${{ secrets.DHARM_GURU_KEYSTORE_PASSWORD }}
          DHARM_GURU_KEY_PASSWORD: ${{ secrets.DHARM_GURU_KEY_PASSWORD }}
          DHARM_GURU_KEY_ALIAS: ${{ secrets.DHARM_GURU_KEY_ALIAS }}
        run: flutter build apk --release --flavor admin -t lib/main_admin.dart --dart-define="BUILD_STAMP=$BUILD_STAMP"
      - name: Verify APK signing fingerprint is the release key
        # Both APKs must carry the permanent release key, never a
        # debug key. Prints the SHA-1 fingerprint for the console
        # steps in FIREBASE-SETUP.md. Fails the build when the
        # cert is a debug cert, so a missing keystore secret can
        # never silently ship a debug signed release APK.
        run: |
          python3 - <<'PYEOF'
          import subprocess
          for apk in [
              'build/app/outputs/flutter-apk/app-user-release.apk',
              'build/app/outputs/flutter-apk/app-admin-release.apk',
          ]:
              data = open(apk, 'rb').read()
              found = False
              i = 0
              while True:
                  j = data.find(b'\x30\x82', i)
                  if j < 0:
                      break
                  ln = 4 + ((data[j+2] << 8) | data[j+3])
                  if 200 < ln < 5000:
                      open('/tmp/cert.der', 'wb').write(data[j:j+ln])
                      r = subprocess.run(['openssl', 'x509', '-inform', 'DER', '-in', '/tmp/cert.der', '-noout', '-subject', '-fingerprint', '-sha1'], capture_output=True, text=True)
                      if r.returncode == 0:
                          out = r.stdout.strip().replace(chr(10), ' | ')
                          print(apk + ': ' + out)
                          if 'Android Debug' in out:
                              print('ERROR: ' + apk + ' is signed with a debug key, not the permanent release key.')
                              raise SystemExit(1)
                          found = True
                          break
                  i = j + 1
              if not found:
                  print('NO CERT FOUND in ' + apk)
                  raise SystemExit(1)
          PYEOF
      - name: Verify APK package names differ
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-user-release.apk | grep "package: name='com.codeair.dharm_guru_shrinkhala'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-admin-release.apk | grep "package: name='com.codeair.dharm_guru_shrinkhala.admin'"
      - name: Verify Firebase classes survived shrinking
        # Release 5 shipped a dex missing FirebaseApp and the
        # FlutterFire plugin classes, so Firebase init failed on
        # the phone. This gate fails the build if any required
        # Firebase class is missing from either APK, or if any
        # Crashlytics class is still present (the dependency was
        # removed, so its classes must be gone).
        run: |
          python3 - <<'PYEOF'
          import sys, zipfile
          required = [
              'Lcom/google/firebase/FirebaseApp;',
              'Lcom/google/firebase/FirebaseOptions;',
              'Lcom/google/firebase/components/ComponentRuntime;',
              'Lcom/google/firebase/installations/FirebaseInstallations;',
              'Lcom/google/firebase/remoteconfig/FirebaseRemoteConfig;',
              'Lcom/google/firebase/auth/FirebaseAuth;',
              'Lcom/google/firebase/firestore/FirebaseFirestore;',
              'Lcom/google/firebase/messaging/FirebaseMessaging;',
              'Lio/flutter/plugins/firebase/core/FlutterFirebaseCorePlugin;',
          ]
          forbidden = [
              'Lcom/google/firebase/crashlytics/FirebaseCrashlytics;',
              'Lio/flutter/plugins/firebase/crashlytics/FlutterFirebaseCrashlyticsPlugin;',
          ]
          apks = [
              'build/app/outputs/flutter-apk/app-user-release.apk',
              'build/app/outputs/flutter-apk/app-admin-release.apk',
          ]
          failed = False
          for apk in apks:
              dex = b''
              with zipfile.ZipFile(apk) as z:
                  for name in z.namelist():
                      if name.startswith('classes') and name.endswith('.dex'):
                          dex += z.read(name)
              for desc in required:
                  if desc.encode() not in dex:
                      print(f'MISSING in {apk}: {desc}')
                      failed = True
              for desc in forbidden:
                  if desc.encode() in dex:
                      print(f'UNEXPECTED in {apk}: {desc}')
                      failed = True
          if failed:
              sys.exit(1)
          print('Firebase dex check passed for both APKs.')
          PYEOF
      - name: Upload user APK
        uses: actions/upload-artifact@v4
        with:
          name: dharm-guru-release-apk
          path: build/app/outputs/flutter-apk/app-user-release.apk
      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: dharm-guru-admin-release-apk
          path: build/app/outputs/flutter-apk/app-admin-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Set build stamp
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "BUILD_STAMP=$(git rev-parse --short HEAD) • $VERSION" >> "$GITHUB_ENV"
      - name: Build user iOS app
        run: flutter build ios --release --flavor user --no-codesign --dart-define="BUILD_STAMP=$BUILD_STAMP"
      - name: Verify user bundle id
        run: |
          APP=$(find build/ios -name "Runner.app" -maxdepth 4 | head -n 1)
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")" = "com.codeair.dharmgurushrinkhala"
          mv "$APP" build/ios/Runner-user.app
      - name: Build admin iOS app
        run: flutter build ios --release --flavor admin --no-codesign -t lib/main_admin.dart --dart-define="BUILD_STAMP=$BUILD_STAMP"
      - name: Verify admin bundle id
        run: |
          APP=$(find build/ios -name "Runner.app" -maxdepth 4 | head -n 1)
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")" = "com.codeair.dharmgurushrinkhala.admin"
